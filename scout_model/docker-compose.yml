services:
  scout_model:
    container_name: scout_model_container
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        CUDA_VERSION: "12.2"
    runtime: nvidia
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu, utility, compute]
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./logs:/app/logs
    network_mode: "host"
    environment:
      NVIDIA_VISIBLE_DEVICES: "all"
      PYTORCH_CUDA_ALLOC_CONF: "max_split_size_mb:128"
      NVIDIA_DRIVER_CAPABILITIES: "compute,utility"
      CUDA_VISIBLE_DEVICES: "0"
      BNB_CUDA_VERSION: "122"
      HUGGING_FACE_TOKEN: "${HUGGING_FACE_TOKEN}"
      API_PORT: "8010"
      API_HOST: "0.0.0.0"
      MODEL_NAME: "${MODEL_NAME}"
      MAX_TOKEN_LENGTH: "${MAX_TOKEN_LENGTH}"
    env_file:
      - .env
    ports:
      - "8010:8010"
    shm_size: '64gb'
    ulimits:
      memlock: -1
      stack: 67108864
    restart: unless-stopped
    command: [
      "python3", "-m", "uvicorn",
      "src.api.app:app",
      "--host", "0.0.0.0",
      "--port", "8010"
    ]
