version: '3.8'

services:
  scout_model:
    container_name: scout_model_container
    build:
      context: .
      dockerfile: docker/Dockerfile
    volumes:
      - type: bind
        source: ./data
        target: /app/data
      - type: bind
        source: ./models
        target: /app/models
      - type: bind
        source: ./logs
        target: /app/logs
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]
    environment:
      CUDA_VISIBLE_DEVICES: "0"
      NVIDIA_VISIBLE_DEVICES: "all"
      TORCH_CUDA_ARCH_LIST: "7.5;8.0;8.6"
      HUGGING_FACE_TOKEN: ${HUGGING_FACE_TOKEN}
      API_PORT: "8010"
      API_HOST: "0.0.0.0"
      MODEL_NAME: ${MODEL_NAME}
      MAX_TOKEN_LENGTH: ${MAX_TOKEN_LENGTH}
    env_file:
      - .env
    ports:
      - "8010:8010"
    shm_size: '64gb'
    ulimits:
      memlock: -1
      stack: 67108864
    restart: unless-stopped
    command: ["python3", "-m", "uvicorn", "src.api.app:app", "--host", "0.0.0.0", "--port", "8010"]

